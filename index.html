<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Đố vui về Bác Hồ</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff6e0;--card:#fff;--tx:#3a2a1a;--red:#da251d;--gold:#ffcd00;--ok:#2e9e4f;--no:#d63a3a;--bd:#f1d9a8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2a1a14;--card:#3b2820;--tx:#fbeedd;--bd:#6b4a38}}
:root[data-theme="dark"]{--bg:#2a1a14;--card:#3b2820;--tx:#fbeedd;--bd:#6b4a38}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Nunito","Segoe UI",system-ui,sans-serif;min-height:100vh}
#app{max-width:520px;margin:0 auto;padding:14px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar{flex:1;height:12px;background:var(--bd);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold));transition:width .5s}
.pill{background:var(--card);border:2px solid var(--bd);border-radius:20px;padding:3px 10px;font-weight:800;font-size:14px;white-space:nowrap}
button{font:inherit;cursor:pointer}
#mute{background:var(--card);border:2px solid var(--bd);border-radius:50%;width:36px;height:36px;font-size:17px}
.card{background:var(--card);border:3px solid var(--bd);border-radius:22px;padding:12px;box-shadow:0 6px 0 var(--bd);animation:pop .4s}
.card svg{width:100%;height:auto;display:block;border-radius:14px}
h1{margin:6px 0;font-size:26px;color:var(--red);text-align:center}
h2{font-size:19px;margin:12px 4px}
.opts{display:grid;gap:9px}
.opt{background:#fff8e8;color:#3a2a1a;border:3px solid var(--gold);border-radius:15px;padding:12px;font-weight:800;font-size:16px;text-align:left;box-shadow:0 4px 0 #d9a900;transition:transform .12s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #d9a900}
.opt.ok{background:#c9f5d4;border-color:var(--ok);box-shadow:0 4px 0 var(--ok);animation:jump .5s}
.opt.no{background:#ffd3d3;border-color:var(--no);box-shadow:0 4px 0 var(--no);animation:shake .4s}
.opt:disabled{cursor:default}
.big{display:block;width:100%;margin-top:12px;background:var(--red);color:#fff;border:0;border-radius:16px;padding:13px;font-size:18px;font-weight:900;box-shadow:0 5px 0 #8d1410}
.fact{margin:10px 4px 0;padding:10px;border-radius:12px;background:rgba(255,205,0,.2);font-size:15px;line-height:1.4}
#rw{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#rw.on{display:flex}
.rbox{background:var(--card);border-radius:26px;border:4px solid var(--gold);padding:18px;max-width:360px;width:100%;text-align:center;animation:pop .5s}
.rbox svg{width:150px;height:auto;animation:wob 1.2s infinite}
.tag{display:inline-block;padding:3px 12px;border-radius:14px;font-weight:900;font-size:13px;color:#fff}
.shelf{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin:10px 0}
.shelf svg{width:52px;height:auto}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30}
#fx span{position:absolute;top:-30px;animation:fall linear forwards}
.scary{animation:flick .15s 6}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes jump{40%{transform:scale(1.06)}}
@keyframes wob{50%{transform:rotate(6deg) scale(1.05)}0%,100%{transform:rotate(-6deg)}}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@keyframes flick{50%{filter:brightness(.3)}}
</style></head><body>
<div id="fx"></div>
<div id="app"></div>
<div id="rw"></div>
<script>
const $=s=>document.querySelector(s);let ac,mute=false;
function tone(f,d,t,s,v,f2){if(mute)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime+(s||0);o.type=t||'sine';o.frequency.setValueAtTime(f,n);if(f2)o.frequency.exponentialRampToValueAtTime(f2,n+d);g.gain.setValueAtTime(v||.15,n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.connect(g);g.connect(ac.destination);o.start(n);o.stop(n+d)}catch(e){}}
const sfx={click:()=>tone(520,.08,'square',0,.08),
ok:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',i*.09,.18)),
no:()=>{tone(200,.35,'sawtooth',0,.12,90);tone(150,.4,'square',.1,.08,70)},
cute:()=>[880,1175,1568,1319,1760].forEach((f,i)=>tone(f,.14,'sine',i*.08,.15)),
scary:()=>{tone(300,.9,'sawtooth',0,.15,40);tone(80,1,'square',.1,.12,35);[900,850,800].forEach((f,i)=>tone(f,.12,'sine',.5+i*.12,.1))},
win:()=>[523,659,784,659,784,1047,1319].forEach((f,i)=>tone(f,.25,'triangle',i*.14,.2))};
function burst(n,arr){const fx=$('#fx');for(let i=0;i<n;i++){const s=document.createElement('span');s.textContent=arr[i%arr.length];s.style.left=Math.random()*100+'%';s.style.fontSize=(16+Math.random()*22)+'px';s.style.animationDuration=(1.6+Math.random()*1.8)+'s';s.style.animationDelay=Math.random()*.5+'s';fx.appendChild(s);setTimeout(()=>s.remove(),4200)}}
const ST='<polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#ffcd00"/>';
const flag=(x,y,k)=>`<g transform="translate(${x},${y}) scale(${k})"><rect width="60" height="40" fill="#da251d"/><g transform="translate(30,20) scale(1.6)">${ST}</g></g>`;

{q:'Ngày 2/9/1945, Bác Hồ đọc Tuyên ngôn Độc lập ở đâu?',a:['Quảng trường Ba Đình','Hồ Hoàn Kiếm','Cung Văn hóa','Chợ Đồng Xuân'],c:0,img:S.badinh,f:'Tại Quảng trường Ba Đình, Hà Nội, Bác khai sinh nước Việt Nam Dân chủ Cộng hòa.'},
{q:'Ở Phủ Chủ tịch, Bác Hồ sống giản dị trong ngôi nhà nào?',a:['Nhà sàn','Biệt thự lớn','Lâu đài','Nhà cao tầng'],c:0,img:S.stilt,f:'Ngôi nhà sàn bằng gỗ nhỏ bên ao cá là nơi Bác ở và làm việc những năm cuối đời.'},
{q:'Đâu là một trong Năm điều Bác Hồ dạy thiếu niên nhi đồng?',a:['Yêu Tổ quốc, yêu đồng bào','Ăn thật nhiều bim bim','Ngủ nướng mỗi ngày','Chơi game cả ngày'],c:0,img:S.kids,f:'Điều đầu tiên: Yêu Tổ quốc, yêu đồng bào. Các cháu nhớ làm theo nhé!'}];
const SN=[{n:'Bim bim Tôm Hồng Cười',c:'#ff8fb8',k:'cute'},{n:'Bim bim Ma Rừng',c:'#5b3a8c',k:'ghost'},{n:'Bim bim Ngô Vàng Tí Hon',c:'#ffcd00',k:'star'},{n:'Bim bim Ma Cà Rồng',c:'#a3151b',k:'vamp'},{n:'Bim bim Phô Mai Mèo',c:'#ff9a3c',k:'cat'},{n:'Bim bim Quái Vật Một Mắt',c:'#3fa34d',k:'cyc'},{n:'Bim bim Người Hành Tinh',c:'#2bb5a8',k:'alien'}];
const bad=['ghost','vamp','cyc'];
function bag(i){const s=SN[i],e={
cute:'<circle cx="45" cy="72" r="7" fill="#222"/><circle cx="75" cy="72" r="7" fill="#222"/><circle cx="43" cy="70" r="2.5" fill="#fff"/><circle cx="73" cy="70" r="2.5" fill="#fff"/><path d="M48 88Q60 100 72 88" stroke="#222" stroke-width="3" fill="none"/><circle cx="35" cy="86" r="5" fill="#ff5c8a" opacity=".6"/><circle cx="85" cy="86" r="5" fill="#ff5c8a" opacity=".6"/>',
ghost:'<ellipse cx="45" cy="72" rx="8" ry="11" fill="#000"/><ellipse cx="75" cy="72" rx="8" ry="11" fill="#000"/><circle cx="45" cy="74" r="3" fill="#7CFF6b"/><circle cx="75" cy="74" r="3" fill="#7CFF6b"/><path d="M40 98Q47 88 53 98T66 98T80 98" stroke="#000" stroke-width="3" fill="none"/>',
star:'<g transform="translate(45,72) scale(.9)"><polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#fff" stroke="#222"/></g><g transform="translate(75,72) scale(.9)"><polygon points="0,-10 3,-3 10,-3 4,2 6,9 0,5 -6,9 -4,2 -10,-3 -3,-3" fill="#fff" stroke="#222"/></g><path d="M48 88Q60 102 72 88Z" fill="#c0392b"/>',
vamp:'<path d="M35 66L55 74M85 66L65 74" stroke="#000" stroke-width="4"/><circle cx="45" cy="78" r="5" fill="#ff2a2a"/><circle cx="75" cy="78" r="5" fill="#ff2a2a"/><path d="M42 92Q60 104 78 92Z" fill="#000"/><path d="M50 93L53 102L56 94M64 94L67 102L70 93" fill="#fff"/>',
cat:'<polygon points="28,48 36,30 46,46" fill="#ff9a3c"/><polygon points="92,48 84,30 74,46" fill="#ff9a3c"/><circle cx="45" cy="72" r="6" fill="#222"/><circle cx="75" cy="72" r="6" fill="#222"/><path d="M54 84L60 90L66 84M60 90V96M52 98Q60 104 60 96Q60 104 68 98" stroke="#222" stroke-width="2.5" fill="none"/><path d="M20 84H36M20 92H36M84 84H100M84 92H100" stroke="#222" stroke-width="2"/>',
cyc:'<circle cx="60" cy="74" r="16" fill="#fff"/><circle cx="60" cy="74" r="8" fill="#c00"/><circle cx="60" cy="74" r="3" fill="#000"/><path d="M36 98H84L80 108H40Z" fill="#000"/><path d="M42 98V104M52 98V106M62 98V104M72 98V106" stroke="#fff" stroke-width="4"/>',
alien:'<ellipse cx="42" cy="74" rx="10" ry="14" fill="#000" transform="rotate(-20 42 74)"/><ellipse cx="78" cy="74" rx="10" ry="14" fill="#000" transform="rotate(20 78 74)"/><path d="M50 98Q60 104 70 98" stroke="#000" stroke-width="3" fill="none"/><path d="M45 38V24M75 38V24" stroke="#000" stroke-width="3"/><circle cx="45" cy="22" r="4" fill="#ffcd00"/><circle cx="75" cy="22" r="4" fill="#ffcd00"/>'}[s.k];
return `<svg viewBox="0 0 120 150"><path d="M15 20L22 14L29 20L36 14L43 20L50 14L57 20L64 14L71 20L78 14L85 20L92 14L99 20L105 14V130L99 136L92 130L85 136L78 130L71 136L64 130L57 136L50 130L43 136L36 130L29 136L22 130L15 136Z" fill="${s.c}" stroke="#222" stroke-width="3"/><rect x="15" y="40" width="90" height="10" fill="#fff" opacity=".35"/>${e}<text x="60" y="126" text-anchor="middle" font-size="10" font-weight="900" fill="#fff" stroke="#222" stroke-width=".6">BIM BIM</text></svg>`}
let i=0,score=0,got=[],lock=false;
const sh=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
function start(){i=0;score=0;got=[];sfx.click();show()}
function intro(){$('#app').innerHTML=`<div class="card" style="text-align:center"><h1>🇻🇳 Đố vui về Bác Hồ</h1>${S.portrait('#da251d')}<h2>Trả lời đúng để nhận bim bim — có loại dễ thương, có loại… hơi đáng sợ! 👻</h2><button class="big" onclick="start()">Bắt đầu chơi ▶</button><div class="shelf">${SN.map((_,k)=>bag(k)).join('')}</div></div>`}
function show(){lock=false;const q=Q[i],o=sh(q.a.map((t,k)=>({t,ok:k==q.c})));
$('#app').innerHTML=`<div class="top"><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><span class="pill">Câu ${i+1}/${Q.length}</span><span class="pill">🍟 ${score}</span><button id="mute" onclick="mute=!mute;this.textContent=mute?'🔇':'🔊'">${mute?'🔇':'🔊'}</button></div><div class="card">${q.img}<h2>${q.q}</h2><div class="opts">${o.map((x,k)=>`<button class="opt" data-k="${k}">${x.t}</button>`).join('')}</div><div id="res"></div></div>`;
document.querySelectorAll('.opt').forEach((b,k)=>b.onclick=()=>pick(b,o,k))}
function pick(b,o,k){if(lock)return;lock=true;const q=Q[i],ok=o[k].ok;
document.querySelectorAll('.opt').forEach((x,j)=>{x.disabled=true;if(o[j].ok)x.classList.add('ok')});
if(ok){score++;got.push(i);sfx.ok();burst(24,['⭐','🎉','✨','🇻🇳']);setTimeout(()=>reward(),900)}
else{b.classList.add('no');sfx.no();if(navigator.vibrate)navigator.vibrate(200);$('#res').innerHTML=`<div class="fact">❌ Chưa đúng rồi! Đáp án đúng đã được tô xanh.<br>📖 ${q.f}</div><button class="big" onclick="next()">${i<Q.length-1?'Câu tiếp theo ▶':'Xem kết quả 🏆'}</button>`}}
function reward(){const s=SN[i],scary=bad.includes(s.k);
const r=$('#rw');r.innerHTML=`<div class="rbox"><h2 style="margin:0">🎁 Chúc mừng! Bạn trả lời đúng!</h2><div class="${scary?'scary':''}">${bag(i)}</div><h2 style="margin:4px">${s.n}</h2><span class="tag" style="background:${scary?'#5b1a8c':'#ff5c8a'}">${scary?'💀 Kinh dị':'💖 Dễ thương'}</span><div class="fact">📖 ${Q[i].f}</div><button class="big" onclick="closeR()">${i<Q.length-1?'Nhận quà & tiếp tục ▶':'Nhận quà & xem kết quả 🏆'}</button></div>`;
r.classList.add('on');if(scary){sfx.scary();burst(10,['🦇','👻','💀'])}else{sfx.cute();burst(18,['🍬','💖','🌟'])}}
function closeR(){sfx.click();$('#rw').classList.remove('on');next()}
function next(){sfx.click();i++;i<Q.length?show():end()}
function end(){sfx.win();burst(40,['🎉','⭐','🇻🇳','🍟']);const st=score>=6?'🏆 Cháu ngoan Bác Hồ!':score>=4?'👏 Giỏi lắm!':'💪 Cố gắng thêm nhé!';
$('#app').innerHTML=`<div class="card" style="text-align:center"><h1>${st}</h1>${S.kids}<h2>Bạn đúng ${score}/${Q.length} câu</h2><div>${'⭐'.repeat(Math.ceil(score/Q.length*5))}</div><h2>Bộ sưu tập bim bim của bạn:</h2><div class="shelf">${got.length?got.map(k=>bag(k)).join(''):'<span>Chưa có gói nào 😢</span>'}</div><button class="big" onclick="start()">Chơi lại 🔁</button></div>`}
intro();
</script></body></html>
